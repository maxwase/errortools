[package]
name = "errortools-tonic"
authors = ["Max Wase <max.vvase@gmail.com>"]
version = "0.1.0"
edition = "2024"
description = "Maps errortools errors onto gRPC tonic::Status and back."
repository = "https://github.com/maxwase/errortools"
documentation = "https://docs.rs/errortools-tonic"
license = "MIT"
readme = "README.md"
keywords = ["error", "grpc", "tonic", "status", "errortools"]
categories = ["rust-patterns", "network-programming"]
include = ["src/**/*.rs", "README.md", "LICENSE*"]

[dependencies]
errortools = { path = "..", version = "0.4" }
tonic = { version = "0.14.9", default-features = false }
tonic-types = "0.14.9"

[dev-dependencies]
http = "1"
pretty_assertions = "1.4.1"
thiserror = "2"
